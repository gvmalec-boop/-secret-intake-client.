<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WindowsDispatcher Secret Intake</title>
<style>body{font:16px system-ui;max-width:760px;margin:24px auto;padding:0 16px}textarea,input,button{box-sizing:border-box;width:100%;margin:7px 0;padding:12px}textarea{min-height:130px}button{font-weight:700}small{display:block;margin:8px 0}</style>
<h2>WindowsDispatcher Secret Intake</h2><small>Значение шифруется локально в браузере. Эта страница сама ничего не отправляет в сеть.</small>
<label>Public intake manifest<textarea id=m rows=7></textarea></label>
<label>Secret<input id=s type=password autocomplete="off"></label><button id=b>Encrypt locally</button>
<label>Ciphertext envelope<textarea id=o rows=10 readonly></textarea></label>
<script>
const te=new TextEncoder(),b64u=x=>{let s='';new Uint8Array(x).forEach(b=>s+=String.fromCharCode(b));return btoa(s).replaceAll('+','-').replaceAll('/','_').replaceAll('=','')},u32=n=>new Uint8Array([n>>>24,n>>>16&255,n>>>8&255,n&255]);
async function kdf(z,alg){let a=te.encode(alg),o=new Uint8Array(4+a.length+4+4+4);o.set(u32(a.length));o.set(a,4);o.set(u32(256),o.length-4);let x=new Uint8Array(4+z.byteLength+o.length);x.set(u32(1));x.set(new Uint8Array(z),4);x.set(o,4+z.byteLength);return crypto.subtle.digest('SHA-256',x)}
async function kid(j){return b64u(await crypto.subtle.digest('SHA-256',te.encode(JSON.stringify({crv:j.crv,kty:j.kty,x:j.x,y:j.y}))))}
b.onclick=async()=>{try{const m=JSON.parse(document.querySelector('#m').value),s=document.querySelector('#s'),o=document.querySelector('#o'),pub=await crypto.subtle.importKey('jwk',m.publicKey,{name:'ECDH',namedCurve:'P-256'},false,[]),ep=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']),epj=await crypto.subtle.exportKey('jwk',ep.publicKey),exp=m.expires_at,h={alg:'ECDH-ES',enc:'A256GCM',typ:'WD-SECRET-INTAKE+JWE',v:1,kid:m.kid||await kid(m.publicKey),purpose:m.purpose,iat:new Date().toISOString(),exp,jti:b64u(crypto.getRandomValues(new Uint8Array(16))),epk:epj},p=b64u(te.encode(JSON.stringify(h))),z=await crypto.subtle.deriveBits({name:'ECDH',public:pub},ep.privateKey,256),cek=await kdf(z,'A256GCM'),aes=await crypto.subtle.importKey('raw',cek,{name:'AES-GCM'},false,['encrypt']),iv=crypto.getRandomValues(new Uint8Array(12)),out=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:te.encode(p)},aes,te.encode(s.value)));o.value=`${p}..${b64u(iv)}.${b64u(out.slice(0,-16))}.${b64u(out.slice(-16))}`;s.value=''}catch(e){alert('Cannot create envelope: '+e.message)}};
</script>
