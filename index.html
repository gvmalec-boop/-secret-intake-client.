<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WindowsDispatcher Secret Intake</title>

<h2>WindowsDispatcher Secret Intake</h2><small>Значение шифруется локально в браузере. Эта страница сама ничего не отправляет в сеть.</small>
<details><summary>Технические данные</summary><label>Public intake manifest<textarea id=m rows=7></textarea></label></details>
<label>Название записи<input id=n autocomplete="off" placeholder="Например: Pushover"></label><label>Логин / email<input id=l autocomplete="off"></label><label>Пароль / ключ<input id=s type=password autocomplete="off"></label><label>Дополнительные поля<textarea id=x rows=4 placeholder="PIN: ...&#10;API Key: ..."></textarea></label><button id=b>Зашифровать локально</button>
<details><summary>Зашифрованный контейнер</summary><textarea id=o rows=10 readonly></textarea></details>
<script>\ndocument.addEventListener("DOMContentLoaded",()=>{document.querySelector("#m").value="{\"v\":1,\"purpose\":\"TEST_ONLY\",\"expires_at\":\"2026-09-28T22:30:00.000Z\",\"kid\":\"9FNkqFmQJcW8cWw5QrSKgmmsdkOkME8i0pry3mT2XHA\",\"publicKey\":{\"kty\":\"EC\",\"x\":\"E0NT04NXNWvONTkSAkMT-ijpdna4_BIUnCBlyp-tB8M\",\"y\":\"6KoRH-HUELwquM7qQYjYDqKoIA6K96vukQdfGIAGwIc\",\"crv\":\"P-256\"}}"});
const te=new TextEncoder(),b64u=x=>{let s='';new Uint8Array(x).forEach(b=>s+=String.fromCharCode(b));return btoa(s).replaceAll('+','-').replaceAll('/','_').replaceAll('=','')},u32=n=>new Uint8Array([n>>>24,n>>>16&255,n>>>8&255,n&255]);
async function kdf(z,alg){let a=te.encode(alg),o=new Uint8Array(4+a.length+4+4+4);o.set(u32(a.length));o.set(a,4);o.set(u32(256),o.length-4);let x=new Uint8Array(4+z.byteLength+o.length);x.set(u32(1));x.set(new Uint8Array(z),4);x.set(o,4+z.byteLength);return crypto.subtle.digest('SHA-256',x)}
async function kid(j){return b64u(await crypto.subtle.digest('SHA-256',te.encode(JSON.stringify({crv:j.crv,kty:j.kty,x:j.x,y:j.y}))))}
b.onclick=async()=>{try{const m=JSON.parse(document.querySelector('#m').value),s=document.querySelector('#s'),o=document.querySelector('#o'),payload=JSON.stringify({v:1,name:document.querySelector('#n').value,login:document.querySelector('#l').value,secret:s.value,extra:document.querySelector('#x').value}),pub=await crypto.subtle.importKey('jwk',m.publicKey,{name:'ECDH',namedCurve:'P-256'},false,[]),ep=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']),epj=await crypto.subtle.exportKey('jwk',ep.publicKey),exp=m.expires_at,h={alg:'ECDH-ES',enc:'A256GCM',typ:'WD-SECRET-INTAKE+JWE',v:1,kid:m.kid||await kid(m.publicKey),purpose:m.purpose,iat:new Date().toISOString(),exp,jti:b64u(crypto.getRandomValues(new Uint8Array(16))),epk:epj},p=b64u(te.encode(JSON.stringify(h))),z=await crypto.subtle.deriveBits({name:'ECDH',public:pub},ep.privateKey,256),cek=await kdf(z,'A256GCM'),aes=await crypto.subtle.importKey('raw',cek,{name:'AES-GCM'},false,['encrypt']),iv=crypto.getRandomValues(new Uint8Array(12)),out=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:te.encode(p)},aes,te.encode(payload)));o.value=`${p}..${b64u(iv)}.${b64u(out.slice(0,-16))}.${b64u(out.slice(-16))}`;s.value='';document.querySelector('#l').value='';document.querySelector('#x').value=''}catch(e){alert('Cannot create envelope: '+e.message)}};
</script>
