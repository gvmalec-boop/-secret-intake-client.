<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ООО «ООО» — Операционная панель</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;color-scheme:dark;--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--good:#3fb950;--warn:#d29922;--bad:#f85149;--info:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}.wrap{max-width:980px;margin:0 auto;padding:20px 16px 36px}
header{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}h1{font-size:24px;margin:0 0 4px}.sub,.caption{color:var(--muted);font-size:13px}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.mini{padding:6px 9px;font-size:12px}.disabled{opacity:.55}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#21262d;border:1px solid var(--line);padding:10px 14px;border-radius:10px;font-size:13px;z-index:20;max-width:90vw}.schedule-main{min-width:0;flex:1}.schedule-title{font-weight:600;word-break:break-word}
.banner{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.banner strong{font-size:17px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}.good{background:var(--good)}.warn{background:var(--warn)}.bad{background:var(--bad)}.info{background:var(--info)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}.card h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600}
.big{font-size:21px;font-weight:700;margin:2px 0 8px}.meta{font-size:13px;color:var(--muted);line-height:1.5}.reason{margin-top:3px;color:var(--text);font-size:13px;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.section{margin-top:14px}.section h2{font-size:15px;margin:0 0 8px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;margin-bottom:7px;font-size:13px}.state{font-weight:700}
footer{margin-top:16px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:640px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}h1{font-size:21px}.wrap{padding-top:14px}.banner{align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>ООО «ООО»</h1><div class="sub">Операционная панель состояния</div></div><button id="refresh">Обновить</button></header>
<div id="app"><div class="banner"><strong>Загрузка…</strong></div></div>
<footer>Автообновление каждые 10 секунд · управление расписаниями защищено PIN · без содержимого писем и документов</footer>
</div>
<script>
var RU={HEALTHY:"Норма",ATTENTION:"Требует внимания",DEGRADED_LOCAL:"Локальный контур недоступен",RUNNING:"В работе",WAITING_USER:"Ждёт Василия",WAITING_LOCAL_DEPENDENCY:"Ждёт компьютер",FAILED:"Ошибка",UNCERTAIN:"Нужна сверка",DONE:"Завершено"};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\\\"":"&quot;","'":"&#39;"}[m]})}
function fmt(t){return t?new Intl.DateTimeFormat("ru-RU",{timeZone:"Asia/Jerusalem",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date(t)):"—"}
function cls(code){
 if(["HEALTHY","ONLINE_IDLE","IDLE_READY","ACTIVE","DONE"].indexOf(code)>=0)return"good";
 if(["FAILED","ERROR","EXPIRED","OFFLINE","ATTENTION"].indexOf(code)>=0)return"bad";
 if(["WAITING_USER","WAITING_LOCAL","WAITING_LOCAL_DEPENDENCY","RENEW_DUE","NOT_CONFIGURED"].indexOf(code)>=0)return"warn";
 return"info";
}
function agentCard(title,x,extra){
 return '<div class="card"><h2>'+esc(title)+'</h2><div class="caption">Статус</div><div class="big"><span class="dot '+cls(x.code)+'"></span>'+esc(x.label)+'</div><div class="reason">'+esc(x.detail||"")+'</div><div class="meta">'+extra+'</div></div>';
}
const ACTION_URL="https://fqznrqxucpyqyxgfrvda.supabase.co/functions/v1/ooo-dashboard-action";
function toast(msg){
  var old=document.getElementById("toast"); if(old) old.remove();
  var x=document.createElement("div"); x.id="toast"; x.className="toast"; x.textContent=msg;
  document.body.appendChild(x); setTimeout(function(){x.remove()},2600);
}
function getPin(){
  var p=localStorage.getItem("oooDashboardPin")||"";
  if(/^\d{8}$/.test(p)) return p;
  p=prompt("Введите 8-значный PIN управления расписаниями:")||"";
  if(!/^\d{8}$/.test(p)){toast("Нужен 8-значный PIN");return "";}
  localStorage.setItem("oooDashboardPin",p); return p;
}
async function action(name,payload){
  var pin=getPin(); if(!pin) return false;
  var r=await fetch(ACTION_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({pin:pin,action:name},payload||{}))});
  var d={}; try{d=await r.json()}catch{}
  if(r.status===401){localStorage.removeItem("oooDashboardPin");toast("Неверный PIN. Введите его заново.");return false;}
  if(!r.ok){toast("Команда не выполнена: "+(d.error||("HTTP "+r.status)));return false;}
  toast("Готово"); await load(); return true;
}
function localInputDefault(iso){
  var d=iso?new Date(iso):new Date(Date.now()+3600000);
  var z=new Date(d.getTime()-d.getTimezoneOffset()*60000);
  return z.toISOString().slice(0,16);
}
async function rescheduleOne(id,iso){
  var v=prompt("Новая дата и время (ГГГГ-ММ-ДДTЧЧ:ММ):",localInputDefault(iso));
  if(!v)return;
  var d=new Date(v);
  if(isNaN(d.getTime())){toast("Неверная дата");return;}
  await action("ONE_TIME_RESCHEDULE",{task_id:id,new_time:d.toISOString()});
}
async function deferRecurring(id,iso){
  var v=prompt("Когда выполнить ближайший запуск?",localInputDefault(iso));
  if(!v)return;
  var d=new Date(v);
  if(isNaN(d.getTime())){toast("Неверная дата");return;}
  await action("RECURRING_DEFER_NEXT",{schedule_id:id,new_time:d.toISOString()});
}
async function toggleRecurring(id,enabled){
  await action(enabled?"RECURRING_DISABLE":"RECURRING_ENABLE",{schedule_id:id});
}
async function load(){
 try{
  var r=await fetch("https://fqznrqxucpyqyxgfrvda.supabase.co/functions/v1/ooo-dashboard?json=1",{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  var d=await r.json();
  var recent=(d.recent||[]).map(function(x){
    return '<div class="row"><span>'+esc(x.source)+' · '+esc(x.stage||"процесс")+'</span><span class="state">'+esc(RU[x.state]||x.state)+' · '+fmt(x.time)+'</span></div>';
  }).join("");
  if(!recent)recent='<div class="row"><span>Событий пока нет</span></div>';
  var s=d.schedule||{one_time:[],recurring:[]};
  var planned=(s.one_time||[]).map(function(x){
    return '<div class="row"><div class="schedule-main"><div class="schedule-title">'+esc(x.title||"Разовая задача")+'</div><div class="caption">разово · '+fmt(x.scheduled_for)+'</div></div><div class="actions"><button class="mini" onclick="rescheduleOne(\''+esc(x.task_id)+'\',\''+esc(x.scheduled_for)+'\')">Перенести</button></div></div>';
  }).concat((s.recurring||[]).map(function(x){
    var kind=x.schedule_kind==="DAILY"?"ежедневно":"по дням недели";
    var off=x.enabled?"":" disabled";
    var status=x.enabled?"включено":"выключено";
    return '<div class="row'+off+'"><div class="schedule-main"><div class="schedule-title">'+esc(x.title||"Повторяющаяся задача")+'</div><div class="caption">'+esc(kind)+' · '+esc(status)+' · следующий: '+fmt(x.next_run_at)+'</div></div><div class="actions"><button class="mini" onclick="toggleRecurring(\''+esc(x.schedule_id)+'\','+(x.enabled?"true":"false")+')">'+(x.enabled?"Выключить":"Включить")+'</button>'+(x.enabled?'<button class="mini" onclick="deferRecurring(\''+esc(x.schedule_id)+'\',\''+esc(x.next_run_at)+'\')">Перенести следующий</button>':'')+'</div></div>';
  })).join("");
  if(!planned)planned='<div class="row"><span>Запланированных задач нет</span></div>';
  var html='';
  html+='<div class="banner"><div><div class="caption">Статус системы</div><strong><span class="dot '+cls(d.overall.code)+'"></span>'+esc(d.overall.label)+'</strong><div class="reason">'+esc(d.overall.detail||"")+'</div><div class="meta">Обновлено: '+fmt(d.generated_at)+'</div></div><div class="meta">Решений Василия: <b>'+d.overall.user_actions+'</b></div></div>';
  html+='<div class="grid">';
  html+=agentCard("Клавдия",d.klavdia,'Последняя активность: '+fmt(d.klavdia.last_activity_at));
  html+=agentCard("Толик",d.tolik,'ПК: '+esc(d.tolik.computer||"—")+'<br>Пульс: '+fmt(d.tolik.last_heartbeat_at)+'<br>Активных локальных задач: '+d.tolik.active_handoffs);
  html+='<div class="card"><h2>Задачи</h2><div class="big">'+d.tasks.open_total+' открыто</div>';
  html+='<div class="stats"><div class="stat"><b>'+d.tasks.running+'</b><span>в работе</span></div><div class="stat"><b>'+d.tasks.waiting_user+'</b><span>ждут тебя</span></div><div class="stat"><b>'+d.tasks.waiting_local+'</b><span>ждут ПК</span></div></div>';
  html+='<div class="stats"><div class="stat"><b>'+d.tasks.failed+'</b><span>ошибки</span></div><div class="stat"><b>'+d.tasks.uncertain+'</b><span>сверка</span></div><div class="stat"><b>'+d.tasks.done_24h+'</b><span>готово 24ч</span></div></div></div>';
  html+='<div class="card"><h2>Gmail</h2><div class="caption">Статус</div><div class="big"><span class="dot '+cls(d.gmail.watch_code)+'"></span>'+esc(d.gmail.watch_label)+'</div><div class="meta">Последний push: '+fmt(d.gmail.last_push_at)+'<br>Последнее продление: '+fmt(d.gmail.last_renewed_at)+'<br>Срок подписки: '+fmt(d.gmail.expiration_at)+'</div></div>';
  html+='</div><div class="section"><h2>Запланировано</h2>'+planned+'</div><div class="section"><h2>Последние процессы</h2>'+recent+'</div>';
  document.getElementById("app").innerHTML=html;
 }catch(e){
  document.getElementById("app").innerHTML='<div class="banner"><strong><span class="dot bad"></span>Не удалось получить состояние</strong><div class="meta">'+esc(e.message)+'</div></div>';
 }
}
document.getElementById("refresh").onclick=load;
load();setInterval(load,10000);
</script>
</body>
</html>
